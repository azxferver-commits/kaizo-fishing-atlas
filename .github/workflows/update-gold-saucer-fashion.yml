name: Update Gold Saucer Fashion Report

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-fashion-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Synchronize weekly Fashion Report
        run: python3 gold-saucer/scripts/sync-fashion-report.py

      - name: Commit only when weekly data changed
        run: |
          if git diff --quiet -- gold-saucer/data/fashion-report.json; then
            echo "Fashion Report is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gold-saucer/data/fashion-report.json
          git commit -m "chore: update Gold Saucer Fashion Report"
          git push
