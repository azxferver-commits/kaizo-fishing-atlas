name: KAIZO Temporary Master Export
on:
  push:
    branches:
      - kaizo-temp-export-20260921
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package master export
        uses: actions/upload-artifact@v4
        with:
          name: kaizo-boss-master-json-export
          path: _kaizo_temp_export_20260921/**
          if-no-files-found: error
          compression-level: 9
          retention-days: 1
