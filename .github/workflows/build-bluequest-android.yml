name: Build BlueQuest Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "bluequest-app/**"
      - "bluequest-mobile-v4/**"
      - "blue-quest-atlas-1-80/data.json"
      - "blue-quest-atlas-80-100/data.json"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bluequest-app
    env:
      BLUEQUEST_SUPABASE_URL: ${{ vars.BLUEQUEST_SUPABASE_URL }}
      BLUEQUEST_SUPABASE_ANON_KEY: ${{ vars.BLUEQUEST_SUPABASE_ANON_KEY }}
      BLUEQUEST_FUNCTIONS_BASE: ${{ vars.BLUEQUEST_FUNCTIONS_BASE }}
      BLUEQUEST_DISCORD_OAUTH_START: ${{ vars.BLUEQUEST_DISCORD_OAUTH_START }}
      BLUEQUEST_YOUTUBE_OAUTH_START: ${{ vars.BLUEQUEST_YOUTUBE_OAUTH_START }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -n "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Capacitor
        run: npm install

      - name: Build offline web bundle
        run: npm run prepare:web

      - name: Generate Android project
        run: npx cap add android

      - name: Patch BlueQuest deep link
        run: node scripts/patch-android-deeplink.js

      - name: Sync BlueQuest into Android
        run: npx cap sync android

      - name: Build installable debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload BlueQuest APK
        uses: actions/upload-artifact@v4
        with:
          name: BlueQuest-Atlas-Android-debug
          path: bluequest-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


      - name: Publish downloadable APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk BlueQuest-Atlas-Android-1.4.apk
          gh release view bluequest-android-v1.4.0 >/dev/null 2>&1 || gh release create bluequest-android-v1.4.0 --title "BlueQuest Atlas Android 1.4" --notes "BlueQuest Atlas Android 1.4. Includes 433 Blue Quest entries offline plus the account/entitlement architecture."
          gh release upload bluequest-android-v1.4.0 BlueQuest-Atlas-Android-1.4.apk --clobber
